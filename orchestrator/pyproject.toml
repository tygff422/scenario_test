[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator"
version = "0.1.0"
requires-python = "~=3.11.0"
dependencies = [
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
    "usb-camera-adapter",
    "adapter-core",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
usb-camera-adapter = { workspace = true }
adapter-core = { workspace = true }
