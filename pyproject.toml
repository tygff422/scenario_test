[project]
name = "scenario-test"
version = "0.1.0"
requires-python = "~=3.11.0"
dependencies = [
    "orchestrator",
    "usb-camera-adapter",
    "normalizer",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "orchestrator",
    "adapters/usb_camera_adapter",
    "adapters/core",
    "normalizer",
]

[tool.uv.sources]
orchestrator = { workspace = true }
usb-camera-adapter = { workspace = true }
normalizer = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "hardware: 実機USBカメラが必要なテスト（デフォルトでは除外: -m \"not hardware\"）",
]

# カバレッジ計測対象（01_docs/known_issues.md No.2対応）。常時は測らず、
# `uv run pytest -m "not hardware" --cov --cov-report=term-missing`のように
# 明示的に--covを付けた時だけ計測される（addoptsには入れていない）。
[tool.coverage.run]
source = ["orchestrator", "normalizer", "adapter_core", "camera_adapter", "camera_controller"]
